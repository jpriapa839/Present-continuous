<style>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];

function mc(el,t,items,why){let i=0,s=0;const show=()=>{

 $$(".o",el).forEach(b=>b.onclick=()=>{const r=q.o[b.dataset.k]==q.a;$$(".o",el).forEach(x=>{x.disabled=true;if(q.o[x.dataset.k]==q.a)x.classList.add("good")});if(!r)b.classList.add("bad");if(r)s++;fx(r);$(".fb",el).innerHTML=r?"✅ CORRECT! 👍 Excellent!":"❌ Not quite! The answer is <b>"+q.a+"</b>."+(why&&q.w?"<br><i>"+q.w+"</i>":"");const n=$(".nx",el);n.hidden=false;n.onclick=()=>{i++;show()}})};show()}

 el.innerHTML=`<div class="card"><h2>${t}<small id="sc">⭐ 0/${items.length}</small></h2>${items.map((it,i)=>`<div class="row" data-i="${i}"><span>${it.q.includes("__")?it.q.split("__").join("<input>"):it.q+' → <input class="w">'}</span><button class="b l ck">CHECK ANSWER</button><button class="b s sw">SHOW ANSWER</button><em class="fb"></em></div>`).join("")}</div>`;
 $$(".row",el).forEach(r=>{const i=r.dataset.i,it=items[i],ins=$$("input",r),bl=it.q.includes("__"),fb=$(".fb",r),ans=bl?it.a.split("|"):[].concat(it.a);

  $(".sw",r).onclick=()=>{bl?ins.forEach((x,k)=>x.value=ans[k]):ins[0].value=ans[0];sh.add(i);fb.className="fb";fb.innerHTML="👀 Answer shown (no point)"}})}
function ord(el,t,items){let s=0;el.innerHTML=`<div class="card"><h2>${t}<small id="sc">⭐ 0/${items.length}</small></h2></div>`;const c=$(".card",el);
 items.forEach(it=>{const r=document.createElement("div");r.className="row";c.append(r);let pool=shuf(it.w.map((w,k)=>({w,k}))),bt=[],msg="",got=0,shown=0;
  const draw=()=>{r.innerHTML=`<div class="bt">${bt.map(x=>`<button class="b l" data-k="${x.k}">${x.w}</button>`).join("")||"<small>Tap the words in order…</small>"}</div><div class="pl">${pool.map(x=>`<button class="b s" data-k="${x.k}">${x.w}</button>`).join("")}</div><button class="b l ck">CHECK ANSWER</button><button class="b s sw">SHOW ANSWER</button><button class="b rs">↺</button><em class="fb">${msg}</em>`;
   $$(".pl .b",r).forEach(b=>b.onclick=()=>{const x=pool.find(p=>p.k==b.dataset.k);pool=pool.filter(p=>p!=x);bt.push(x);draw()});
   $$(".bt .b",r).forEach(b=>b.onclick=()=>{const x=bt.find(p=>p.k==b.dataset.k);bt=bt.filter(p=>p!=x);pool.push(x);draw()});
   $(".rs",r).onclick=()=>{pool=shuf([...pool,...bt]);bt=[];msg="";draw()};

 $(".rv",r).onclick=()=>{$(".ans",r).hidden=false;$(".aw",r).hidden=false;beep(660)}}

 el.innerHTML=`<div class="card"><h2>${t}<small>${i+1}/${items.length}${o.boss?" · 🏆 "+p+" pts":""}</small></h2><div class="qb"></div><div><button class="b s pv">←</button><button class="b s nx">${last&&o.end?"FINISH 🏁":"→"}</button></div></div>`;

 qbox(qb,q,p,ex);if(o.secs)tReset(o.secs);
 $$(".o",qb).forEach(b=>b.onclick=()=>{$(".rv",qb).click();const r=o.mode=="cw"?(+b.dataset.v==(q.c?1:0)):b.dataset.v==q.a;$$(".o",qb).forEach(x=>{x.disabled=true;if(o.mode=="mc"&&x.dataset.v==q.a)x.classList.add("good")});b.classList.add(r?"good":"bad");fx(r)});
 $(".pv",el).onclick=()=>{i=Math.max(0,i-1);show()};$(".nx",el).onclick=()=>{if(!last){i++;show()}else if(o.end)go(FIN)}};show()}
function roul(el){let bag=[],rot=0;el.innerHTML=`<div class="card" style="text-align:center"><h2>GRAMMAR ROULETTE</h2><div class="wrap"><div class="wheel"></div><i class="ptr">▼</i></div><button class="b sp" style="font-size:1.3em">SPIN!</button><div class="rq" style="text-align:left"></div></div>`;
 $(".sp",el).onclick=()=>{if(!bag.length)bag=shuf(RO);const q=bag.pop();rot+=1080+(Math.random()*360|0);$(".wheel",el).style.transform=`rotate(${rot}deg)`;$(".rq",el).innerHTML="";beep(500,.1);setTimeout(()=>{qbox($(".rq",el),{q:"🎯 <u>"+q.t+"</u> — "+q.q,a:q.a},10);boom(20)},2300)}}

/* DATA */
const pr=(a,t,w)=>a.map(x=>({q:t+x[0],a:x[1],w}));

const WU=[m("She ___ TV now.","watches|is watching|watching","is watching"),m("They ___ football at the moment.","are playing|plays|playing","are playing"),m("I ___ listening to music.","am|is|are","am"),m("___ he sleeping?","Is|Does|Are","Is"),m("We aren’t ___ lunch.","have|having|has","having")];
const UT=[m("Look! It’s raining.","Now|Temporary|Plan","Now","Look! = happening now."),m("I’m studying French this year.","Now|Temporary|Plan","Temporary","This year = for a short period."),m("We’re going to the cinema tomorrow.","Now|Temporary|Plan","Plan","A fixed plan for the future."),m("Be quiet! The baby is sleeping.","Now|Temporary|Plan","Now","It is happening now."),m("She’s working in a café this summer.","Now|Temporary|Plan","Temporary","This summer = temporary.")];

const SP=[m("play → ?","playing|plaing|playying","playing"),m("make → ?","makeing|making|makking","making","-e: drop the e."),m("run → ?","runing|running|runeing","running","Short verb: double the n."),m("swim → ?","swiming|swimeing|swimming","swimming","Short verb: double the m."),m("dance → ?","dancing|danceing|dancring","dancing","-e: drop the e.")];

const QT=[m("___ she sleeping?","Is|Are|Does","Is","She → Is."),m("Which is correct?","Are they play?|Are they playing?|Is they playing?","Are they playing?","Are + they + verb-ing."),m("Are you reading? Yes, ___","I am|I do|I’m reading","I am"),m("___ they running?","Are|Is|Do","Are"),m("Is he cooking? No, ___","he isn’t|he doesn’t|he aren’t","he isn’t")];
const LK=[m("🏊 He ___ .","is swimming|swims|is swiming","is swimming"),m("📖 She ___ a book.","is reading|reads|reading","is reading"),m("🌧️ It ___ .","is raining|are raining|rains","is raining"),m("🎤 They ___ .","are singing|is singing|sings","are singing"),m("🍳 My dad ___ dinner.","is cooking|cooks|cooking","is cooking")];
const A1=[m("She ___ a letter now.","writes|is writing|write","is writing","Now = am / is / are + verb-ing."),m("They ___ in the garden.","are playing|is playing|playing","are playing","They → are."),m("I ___ my homework at the moment.","am doing|is doing|do","am doing","I → am."),m("___ your brother watching TV?","Are|Is|Do","Is","Your brother = he → Is."),m("We ___ lunch.","aren’t having|isn’t having|don’t having","aren’t having","We → aren’t."),m("The dog ___ in the park.","is running|is runing|are running","is running","run → running."),m("He ___ a photo.","is taking|is takeing|is take","is taking","take → taking."),m("___ they listening to music?","Are|Is|Do","Are"),m("She ___ her room now.","isn’t cleaning|doesn’t cleaning|not cleaning","isn’t cleaning"),m("What ___ you doing?","are|is|do","are")];
const A2=[{q:"Look! The cat __ (sleep) on the sofa.",a:"is sleeping"},{q:"We __ (not / watch) TV now.",a:"aren’t watching"},{q:"__ you __ (read) a book?",a:"Are|reading"},{q:"Tom __ (play) tennis at the moment.",a:"is playing"},{q:"I __ (write) an email.",a:"am writing"},{q:"My parents __ (cook) dinner.",a:"are cooking"},{q:"She __ (not / run) in the park.",a:"isn’t running",w:"run → running."},{q:"__ he __ (swim)?",a:"Is|swimming",w:"swim → swimming."},{q:"They __ (dance) at the party.",a:"are dancing",w:"dance → dancing."},{q:"I __ (not / listen) to music.",a:"’m not listening"}];
